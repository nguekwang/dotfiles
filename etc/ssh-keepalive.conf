# Linked to /etc/ssh/ssh_config.d/20-keepalive.conf by setup.sh.
#
# Without keepalives ssh notices a dead connection only when TCP gives up,
# which can take hours of sitting on a hung terminal. Probe every 15 seconds
# and give up after three misses, so a dropped link is reported within a
# minute. ~/.ssh/config is read first and wins, so a host can override this.
Host *
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ConnectTimeout 10
