# Linked to /etc/sysctl.d/90-file-watchers.conf by setup.sh.
#
# Raise the inotify watch limit so editors, language servers and file
# watchers (Neovim LSP clients, bundlers) do not hit the 8,192 default ceiling
# on a large tree. Each watch costs about 1 KiB of kernel memory, so 524,288
# watches cap at roughly 512 MiB, and only when all are in use.
fs.inotify.max_user_watches=524288
