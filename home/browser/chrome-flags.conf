# Startup flags for google-chrome-stable, read from
# $XDG_CONFIG_HOME/chrome-flags.conf by the wrapper the Arch package installs.
# One flag per line; a line starting with # is a comment.
#
# Every flag here exists to remove an error this machine actually produced, and
# each is written with the reason, so a future reader can tell which ones are
# still needed. The errors came from a `gh auth login` that opened the browser:
#
#   vaInitialize failed: unknown libva error
#   '--ozone-platform=wayland' is not compatible with Vulkan
#   vkCreateInstance() failed: -9
#   Registration response error message: DEPRECATED_ENDPOINT

# Run natively on Wayland rather than through XWayland. Hyprland is a Wayland
# compositor, and going through XWayland costs a scaling pass and loses
# fractional scaling, the clipboard's MIME types, and per-window input methods.
--ozone-platform-hint=auto

# Input method through the Wayland text-input protocol, which is how fcitx5
# reaches a native Wayland window. Without it Japanese input silently does not
# reach the browser.
--enable-wayland-ime

# Video decode on the GPU. The VA-API driver for Iris Xe is iHD, from the
# intel-media-driver package; Chrome finds it through libva once that is
# installed. Without the driver this flag is inert rather than harmful, so it is
# safe to carry before the package is there.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder
--ignore-gpu-blocklist

# Do not ask for Vulkan. Chrome's own log says `--ozone-platform=wayland` is not
# compatible with it and then fails `vkCreateInstance` with -9
# (VK_ERROR_INCOMPATIBLE_DRIVER), so the request only produces the error: the
# GL path is what actually runs.
--disable-features=Vulkan

# No push messaging. The GCM registration this drives answers
# DEPRECATED_ENDPOINT because Chrome still calls an endpoint Google retired, and
# nothing here subscribes to web push, so the whole exchange is noise in the log.
--disable-background-networking

# Keep the login keyring in the system keyring rather than in a plaintext file,
# so the password sync this browser was chosen for is not stored in the clear.
--password-store=gnome-libsecret

# --- Feature parity with user/browsers/qutebrowser.py (preference, not an error fix) ---

# Matches qutebrowser's `accept_language = 'en-US,en;q=0.9'`: request English-language
# pages regardless of the OS locale.
--lang=en-US

# Matches qutebrowser's `content.autoplay = True`: video plays without a prior click.
--autoplay-policy=no-user-gesture-required

# Suppresses the "Continue where you left off?" bubble. Hyprland kills the Chrome
# process on logout instead of it quitting cleanly, so Chrome treats every session
# as a crash and offers to restore tabs on the next launch.
--disable-session-crashed-bubble

# Silently reopens the previous session's tabs instead of leaving the bubble
# above to just discard them. Chrome is now a background-resident app (see
# user/hypr/hyprland.lua's "hyprland.start" hook and the chrome special
# workspace), so "previous session" in practice means "state before the last
# Hyprland logout/restart", which is exactly what should come back with no
# prompt in between.
--restore-last-session
